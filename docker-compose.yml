services:
  api:
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    volumes:
      - ./api:/app
      - ./api/linux/logrotate.d/app:/etc/logrotate.d/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - code-runner
    environment:
      - CODE_EXECUTOR_HOST=http://code-runner:8080
    working_dir: /app
    command: sh -c "go run cmd/main.go"
    tty: true

  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
      target: dev
    volumes:
      - ./web:/app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_HOST=http://localhost:8000
      - VITE_WS_HOST=ws://localhost:8000
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    tty: true

  db:
    image: postgres:17.4
    volumes:
      - ./api/migrations:/docker-entrypoint-initdb.d
      - ./docker/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=project_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  code-runner:
    build:
      context: .
      dockerfile: ./docker/code-runner/Dockerfile
    expose:
      - "8080"
    environment:
      - CODE_RUNNER_TIMEOUT_SECONDS=5
      - CODE_RUNNER_MAX_SOURCE_BYTES=65536
      - CODE_RUNNER_MAX_OUTPUT_BYTES=65536
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m

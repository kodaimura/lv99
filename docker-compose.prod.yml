services:
  api:
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    volumes:
      - ./api:/app
      - ./api/linux/logrotate.d/app:/etc/logrotate.d/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENV=prod
    working_dir: /app
    command: sh -c "go build cmd/main.go && ./main"
    restart: always
    tty: true

  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
      target: runner
      args:
        VITE_API_HOST: ${VITE_API_HOST:-}
        VITE_WS_HOST: ${VITE_WS_HOST:-}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
    working_dir: /app
    restart: always
